# جلب الأخبار دورياً ثم نشر الموقع على GitHub Pages
name: Fetch news and deploy

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 */6 * * *"     # كل 6 ساعات
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  news:
    # لا يعمل عند push (حتى لا تتكرر الدورة)، فقط جدولة أو تشغيل يدوي
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scanner/package-lock.json
      - name: Install
        working-directory: scanner
        run: npm ci
      - name: Test news filters
        working-directory: scanner
        run: npm test
      - name: Fetch news
        if: ${{ !cancelled() }}
        working-directory: scanner
        run: node news.mjs
      - name: Commit results
        if: ${{ !cancelled() }}
        run: |
          git config user.name "digital-space-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "Update scan results"
            git push
          fi

  deploy:
    continue-on-error: true   # نشر GitHub Pages القديم؛ لا يعطّل نشر Firebase إن أُوقف
    needs: news
    # يعمل بعد الفحص الناجح، أو عند تخطيه (push)
    if: ${{ !cancelled() && (needs.news.result == 'success' || needs.news.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir _site
          cp -r index.html config.js vendor data assets saudi-market _site/
          node extension/build.mjs
          (cd extension && zip -qr ../_site/ipw-extension.zip . -x build.mjs)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  firebase:
    needs: news
    if: ${{ !cancelled() && (needs.news.result == 'success' || needs.news.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check secrets
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::أضف السر FIREBASE_SERVICE_ACCOUNT في إعدادات المستودع (Settings > Secrets and variables > Actions)"; exit 1; fi
      - name: Prepare site
        env:
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          PROACTIVE_SHEET: ${{ secrets.PROACTIVE_SHEET }}
        run: |
          mkdir _site
          cp -r index.html config.js vendor data assets saudi-market _site/
          node extension/build.mjs
          (cd extension && zip -qr ../_site/ipw-extension.zip . -x build.mjs)
          python3 - <<'PY'
          import os,re,json
          p="_site/config.js";s=open(p,encoding="utf8").read()
          for env,key in (("SHEET_TOKEN","sheetToken"),("PROACTIVE_SHEET","proactiveSheet")):
              v=os.environ.get(env)
              if v:
                  s,n=re.subn(key+r':\s*"[^"]*"',lambda m:key+": "+json.dumps(v,ensure_ascii=False),s,count=1)
                  assert n==1,key
          open(p,"w",encoding="utf8").write(s)
          PY
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: saiprasdon
          channelId: live
