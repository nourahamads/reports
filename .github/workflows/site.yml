# الفحص الآلي الدوري ثم نشر الموقع على GitHub Pages
name: Scan and deploy

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 */6 * * *"     # كل 6 ساعات
  workflow_dispatch:
    inputs:
      max:
        description: "أقصى عدد نطاقات للفحص في هذه الدورة"
        required: false
        default: "40"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan:
    # لا يعمل عند push (حتى لا تتكرر الدورة)، فقط جدولة أو تشغيل يدوي
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scanner/package-lock.json
      - name: Install
        working-directory: scanner
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test classifier
        working-directory: scanner
        run: npm test
      - name: Scan
        working-directory: scanner
        run: node scan.mjs --max "${{ github.event.inputs.max || '40' }}"
      - name: Fetch news
        if: ${{ !cancelled() }}
        working-directory: scanner
        run: node news.mjs
      - name: Commit results
        if: ${{ !cancelled() }}
        run: |
          git config user.name "digital-space-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "Update scan results"
            git push
          fi

  deploy:
    needs: scan
    # يعمل بعد الفحص الناجح، أو عند تخطيه (push)
    if: ${{ !cancelled() && (needs.scan.result == 'success' || needs.scan.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir _site
          cp -r index.html config.js vendor data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
